name: General issue
description: Catch-all for work that does not fit other forms.
title: "[Issue] "
labels:
  - triage
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Bug report
        - Feature request
        - Documentation
        - Question
        - Task
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the issue and desired outcome.
    validations:
      required: true
