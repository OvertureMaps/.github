name: Bug report
description: Report a defect or regression.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug and user impact.
      placeholder: A concise description of what failed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the shortest reliable repro.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: impacted_groups
    attributes:
      label: Impacted groups
      description: Select all known groups affected.
      multiple: true
      options:
        - No known cross-group impact
        - Admin
        - Address
        - Base
        - Buildings
        - Data Platform
        - Developer Advocacy
        - Places
        - Schema
        - Transportation
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment and context
      description: Include versions, commit SHAs, region, and logs if relevant.
